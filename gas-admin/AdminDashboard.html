
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #243447;
    }

    header {
      background: #033662;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 7px;
      font-size: 25px;
    }

    header p {
      margin: 0;
      font-size: 13px;
    }

    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 15px 40px;
    }

    .heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    h2 {
      color: #033662;
      font-size: 21px;
      margin: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat, .card {
      background: white;
      border-radius: 13px;
      padding: 18px;
      box-shadow: 0 2px 10px #00000009;
    }

    .stat strong {
      display: block;
      color: #033662;
      font-size: 29px;
      margin-bottom: 6px;
    }

    .stat span {
      font-size: 13px;
      color: #64748b;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    select, button {
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 14px;
    }

    button {
      background: #033662;
      color: white;
      cursor: pointer;
      border: none;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .card {
      margin-bottom: 12px;
      overflow-wrap: anywhere;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .ref {
      font-weight: bold;
      color: #033662;
    }

    .status {
      display: inline-block;
      border-radius: 20px;
      padding: 6px 10px;
      background: #e7f1fb;
      color: #18578b;
      font-size: 11px;
      font-weight: bold;
    }

    .description {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .detail {
      font-size: 13px;
      line-height: 1.8;
      color: #475569;
    }

    .notice {
      padding: 15px;
      background: white;
      border-radius: 12px;
      color: #475569;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .stats { gap: 7px; }

      .stat { padding: 12px; }

      .stat strong { font-size: 24px; }

      .heading, .toolbar {
        flex-wrap: wrap;
      }
    }

/* Fasa 5.0D-D: Tetapan cetakan laporan bulanan */
@media print {
  @page {
    size: A4 portrait;
    margin: 15mm;
  }

  html,
  body {
    background: #fff !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  body {
    font-family: Arial, sans-serif !important;
    font-size: 12pt !important;
    color: #000 !important;
  }

  /* Sembunyikan semua elemen dashboard. */
  body > * {
    display: none !important;
  }

  /* Paparkan hanya laluan ke laporan. */
  body > main {
    display: block !important;
  }

  main > * {
    display: none !important;
  }

  /*
   * Laporan berada dalam main sebelum complaintList.
   * Kekalkan laporan sahaja.
   */
  #monthlyReportPreview {
    display: block !important;
    position: static !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    font-family: Arial, sans-serif !important;
    font-size: 12pt !important;
    color: #000 !important;
  }

  #monthlyReportPreview table {
    width: 100% !important;
    border-collapse: collapse !important;
    font-size: 12pt !important;
  }

  #monthlyReportPreview th,
  #monthlyReportPreview td {
    font-size: 12pt !important;
    vertical-align: top !important;
    overflow-wrap: anywhere;
  }

  #monthlyReportPreview thead {
    display: table-header-group;
  }

  #monthlyReportPreview tr {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  #monthlyReportPreview h2,
  #monthlyReportPreview h3 {
    break-after: avoid;
    page-break-after: avoid;
  }

/* Sembunyikan butang Cetak / Simpan PDF */
#monthlyReportPreview .report-print-btn {
  display: none !important;
}

}


  </style>
</head>

<!-- Fasa 5.0C: Statistik aduan tertunggak -->

<!-- Fasa 5.0A: Carian rekod aduan -->
<div style="margin: 14px 0;">
  <input
    type="search"
    id="searchInput"
    placeholder="Cari ID aduan, lokasi atau kerosakan..."
    aria-label="Carian rekod aduan"
    autocomplete="off"
    oninput="renderComplaints()"
    style="
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      font-size: 15px;
      background: #FFFFFF;
      color: #0E2A47;
    "
  >
</div>

    <div id="message"
         role="status"
         class="notice">
      Memuatkan aduan...
    </div>

    <div id="complaintList"></div>
  </main>

  <script>
    let allComplaints = [];

    const labels = {
      BAHARU: 'Baharu',
      DALAM_SEMAKAN: 'Dalam Semakan',
      DALAM_TINDAKAN: 'Dalam Tindakan',
      SELESAI: 'Selesai',
      DITOLAK: 'Ditolak'
    };

    function addText(parent, tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = String(text || '');

      if (className) {
        element.className = className;
      }

      parent.appendChild(element);
      return element;
    }

    function loadComplaints() {
      const btn = document.getElementById('refreshBtn');
      const message = document.getElementById('message');

      btn.disabled = true;
      message.hidden = false;
      message.textContent = 'Memuatkan aduan...';

      google.script.run
        .withSuccessHandler(function(data) {
          btn.disabled = false;

          allComplaints = data.complaints || [];

          document.getElementById('total')
            .textContent = data.total;

          document.getElementById('newCount')
            .textContent = data.counts.BAHARU || 0;

          document.getElementById('doneCount')
            .textContent = data.counts.SELESAI || 0;



populateYearFilter();
updatePendingStats();
renderComplaints();


        })
        .withFailureHandler(function(error) {
          btn.disabled = false;
          message.hidden = false;
          message.textContent =
            'Gagal memuatkan aduan: ' +
            (error.message || 'Ralat sistem');
        })
        .getAdminComplaints();
    }

/**
 * Fasa 5.0C - Statistik aduan belum selesai.
 * Menggunakan tarikh aduan mengikut waktu Malaysia.
 * Tidak mengubah data Google Sheets.
 */
function updatePendingStats() {
  const activeStatuses = [
    'BAHARU',
    'DALAM_SEMAKAN',
    'DALAM_TINDAKAN'
  ];

  const pending = allComplaints.filter(function(item) {
    return activeStatuses.includes(item.status);
  });

  // Jumlah aduan aktif termasuk rekod bertarikh tidak sah.
  document.getElementById('pendingCount')
    .textContent = pending.length;

  // Tarikh hari ini mengikut waktu Malaysia.

const dateParts = new Intl.DateTimeFormat('en-GB', {
  timeZone: 'Asia/Kuala_Lumpur',
  year: 'numeric',
  month: '2-digit',
  day: '2-digit'
}).formatToParts(new Date());

const dateValues = {};
dateParts.forEach(function(part) {
  if (part.type !== 'literal') {
    dateValues[part.type] = part.value;
  }
});

const todayParts = [
  '',
  dateValues.year,
  dateValues.month,
  dateValues.day
];


  const oldestElement =
    document.getElementById('oldestPending');


if (
  !dateValues.year ||
  !dateValues.month ||
  !dateValues.day
) {

    oldestElement.textContent = 'Semak tarikh';
    return;
  }

  const todayUTC = Date.UTC(
    Number(todayParts[1]),
    Number(todayParts[2]) - 1,
    Number(todayParts[3])
  );

  let oldestDays = null;
  let invalidDates = 0;

  pending.forEach(function(item) {
    const match = String(item.date || '').match(
      /^(\d{2})\/(\d{2})\/(\d{4})(?:\s|$)/
    );

    if (!match) {
      invalidDates++;
      return;
    }

    const day = Number(match[1]);
    const month = Number(match[2]);
    const year = Number(match[3]);

    const complaintUTC = Date.UTC(year, month - 1, day);
    const check = new Date(complaintUTC);

    // Elakkan tarikh tidak sah seperti 31 Februari.
    if (
      check.getUTCFullYear() !== year ||
      check.getUTCMonth() !== month - 1 ||
      check.getUTCDate() !== day
    ) {
      invalidDates++;
      return;
    }

    const days = Math.floor(
      (todayUTC - complaintUTC) / 86400000
    );

    // Aduan bertarikh masa depan perlu disemak.
    if (days < 0) {
      invalidDates++;
      return;
    }

    if (oldestDays === null || days > oldestDays) {
      oldestDays = days;
    }
  });

  if (invalidDates > 0) {
    oldestElement.textContent = 'Semak tarikh';
    oldestElement.title =
      invalidDates + ' aduan belum selesai mempunyai tarikh tidak sah.';
  } else {
    oldestElement.textContent =
      oldestDays === null ? '0 hari' : oldestDays + ' hari';
    oldestElement.removeAttribute('title');
  }
}

/**
 * Fasa 5.0B - Jana pilihan tahun secara automatik.
 * Menggunakan tarikh aduan dalam format dd/MM/yyyy HH:mm.
 */
function populateYearFilter() {
  const select = document.getElementById('yearFilter');
  const previousValue = select.value;

  const years = new Set();

  allComplaints.forEach(function(item) {
    const match = String(item.date || '').match(
      /^\d{2}\/\d{2}\/(\d{4})(?:\s|$)/
    );

    if (match) {
      years.add(match[1]);
    }
  });

  // Bina semula pilihan tanpa memasukkan HTML mentah.
  select.replaceChildren();

  const allOption = document.createElement('option');
  allOption.value = 'ALL';
  allOption.textContent = 'Semua Tahun';
  select.appendChild(allOption);

  Array.from(years)
    .sort(function(a, b) {
      return Number(b) - Number(a);
    })
    .forEach(function(year) {
      const option = document.createElement('option');
      option.value = year;
      option.textContent = year;
      select.appendChild(option);
    });

  // Kekalkan tahun yang dipilih selepas Muat Semula,
  // jika tahun tersebut masih wujud.
  const available = Array.from(select.options).some(
    function(option) {
      return option.value === previousValue;
    }
  );

  select.value = available ? previousValue : 'ALL';
}

/**
 * Memuatkan gambar aduan daripada GAS.
 * Hanya backend admin dibenarkan membaca fail.
 */
function loadComplaintImages(complaintId, card, button) {
  // Jika gambar sudah dipaparkan, sembunyikan.
  const existing = card.querySelector('.image-gallery');

  if (existing) {
    existing.remove();
    button.textContent = 'Lihat Gambar';
    return;
  }

  button.disabled = true;
  button.textContent = 'Memuatkan gambar...';

  google.script.run
    .withSuccessHandler(function(images) {
      button.disabled = false;

      const gallery = document.createElement('div');
      gallery.className = 'image-gallery';
      gallery.style.marginTop = '14px';

      if (!images.length) {
        const notice = document.createElement('p');
        notice.textContent = 'Tiada gambar ditemui.';
        gallery.appendChild(notice);
      }

      images.forEach(function(image) {
        const img = document.createElement('img');

        img.src = image.dataUrl;
        img.alt = 'Gambar kerosakan ' + image.index;
        img.style.width = '100%';
        img.style.maxWidth = '480px';
        img.style.height = 'auto';
        img.style.display = 'block';
        img.style.marginBottom = '12px';
        img.style.borderRadius = '10px';

        gallery.appendChild(img);
      });

      card.appendChild(gallery);
      button.textContent = 'Sembunyikan Gambar';
    })
    .withFailureHandler(function(error) {
      button.disabled = false;
      button.textContent = 'Lihat Gambar';

      alert(
        'Gagal memuatkan gambar: ' +
        (error.message || 'Ralat sistem')
      );
    })
    .getAdminComplaintImages(complaintId);
}

/**
 * Fasa 4.4B - Paparan Sejarah Tindakan.
 * Membaca rekod sahaja. Tiada perubahan database.
 */
function loadActionHistory(complaintId, card, button) {
  const existing = card.querySelector('.action-history');

  // Jika sejarah sedang dipaparkan, sembunyikan.
  if (existing) {
    existing.remove();
    button.textContent = 'Sejarah Tindakan';
    return;
  }

  button.disabled = true;
  button.textContent = 'Memuatkan sejarah...';

  google.script.run
    .withSuccessHandler(function(history) {
      button.disabled = false;

      const container = document.createElement('div');
      container.className = 'action-history';
      container.style.marginTop = '15px';
      container.style.padding = '15px';
      container.style.background = '#F5F7FA';
      container.style.borderRadius = '10px';

      const heading = document.createElement('h4');
      heading.textContent = 'Sejarah Tindakan';
      container.appendChild(heading);

      if (!history.length) {
        const empty = document.createElement('p');
        empty.textContent = 'Belum ada rekod tindakan.';
        container.appendChild(empty);
      }

      history.forEach(function(action) {
        const entry = document.createElement('div');
        entry.style.padding = '12px 0';
        entry.style.borderBottom = '1px solid #ddd';

        const date = document.createElement('strong');
        date.textContent = action.date || '-';

        const status = document.createElement('p');
        status.textContent =
          (action.previousStatus || '-') +
          ' → ' +
          (action.newStatus || '-');

        const assignee = document.createElement('p');
        assignee.textContent =
          'Tanggungjawab: ' + (action.assignee || '-');

        const note = document.createElement('p');
        note.textContent =
          'Catatan: ' + (action.note || '-');

        const target = document.createElement('p');
        target.textContent =
          'Tarikh Sasaran: ' + (action.targetDate || '-');

        entry.appendChild(date);
        entry.appendChild(status);
        entry.appendChild(assignee);
        entry.appendChild(note);
        entry.appendChild(target);

        container.appendChild(entry);
      });

      card.appendChild(container);
      button.textContent = 'Sembunyikan Sejarah';
    })
    .withFailureHandler(function(error) {
      button.disabled = false;
      button.textContent = 'Sejarah Tindakan';

      alert(
        'Gagal memuatkan sejarah: ' +
        (error.message || 'Ralat sistem')
      );
    })
    .getAdminActionHistory(complaintId);
}

/**
 * Paparkan atau sembunyikan borang tindakan.
 * Belum menyimpan data.
 */
function openActionForm(item, card, button) {
  const existing = card.querySelector('.action-form');

  if (existing) {
    existing.remove();
    button.textContent = 'Rekod Tindakan';
    return;
  }

  const container = document.createElement('div');
  container.className = 'action-form';
  container.style.marginTop = '15px';
  container.style.padding = '16px';
  container.style.background = '#f3f6fa';
  container.style.borderRadius = '12px';

  const heading = document.createElement('h3');
  heading.textContent = 'Rekod Tindakan';
  container.appendChild(heading);

  // Pilihan status.
  const statusLabel = document.createElement('label');
  statusLabel.textContent = 'Status Aduan';
  container.appendChild(statusLabel);

  const status = document.createElement('select');
  status.style.width = '100%';

  const statuses = [
    ['BAHARU', 'Baharu'],
    ['DALAM_SEMAKAN', 'Dalam Semakan'],
    ['DALAM_TINDAKAN', 'Dalam Tindakan'],
    ['SELESAI', 'Selesai'],
    ['DITOLAK', 'Ditolak']
  ];

  statuses.forEach(function(optionData) {
    const option = document.createElement('option');
    option.value = optionData[0];
    option.textContent = optionData[1];
    status.appendChild(option);
  });

  status.value = item.status;
  container.appendChild(status);

  // Pihak bertanggungjawab.
  const assigneeLabel = document.createElement('label');
  assigneeLabel.textContent =
    'Pegawai / Pihak Bertanggungjawab';
  container.appendChild(assigneeLabel);

  const assignee = document.createElement('input');
  assignee.type = 'text';
  assignee.placeholder =
    'Contoh: En. Faiezal / Kontraktor ABC';
  assignee.minLength = 3;
  assignee.maxLength = 150;
  assignee.required = true;
  assignee.style.width = '100%';
  assignee.style.padding = '11px';
  assignee.style.border = '1px solid #cbd5e1';
  assignee.style.borderRadius = '9px';
  container.appendChild(assignee);

  // Catatan tindakan.
  const noteLabel = document.createElement('label');
  noteLabel.textContent = 'Catatan Tindakan';
  container.appendChild(noteLabel);

  const note = document.createElement('textarea');
  note.placeholder =
    'Nyatakan pemeriksaan atau pembaikan yang dilakukan.';
  note.minLength = 10;
  note.maxLength = 2000;
  note.required = true;
  note.style.width = '100%';
  note.style.minHeight = '100px';
  note.style.padding = '11px';
  note.style.border = '1px solid #cbd5e1';
  note.style.borderRadius = '9px';
  container.appendChild(note);

  // Tarikh sasaran.
  const dateLabel = document.createElement('label');
  dateLabel.textContent =
    'Tarikh Sasaran (pilihan)';
  container.appendChild(dateLabel);

  const targetDate = document.createElement('input');
  targetDate.type = 'date';
  targetDate.style.width = '100%';
  targetDate.style.padding = '11px';
  targetDate.style.border = '1px solid #cbd5e1';
  targetDate.style.borderRadius = '9px';
  container.appendChild(targetDate);

 
  // Butang Simpan Tindakan.
  const saveBtn = document.createElement('button');
  saveBtn.type = 'button';
  saveBtn.textContent = 'Simpan Tindakan';
  saveBtn.style.marginTop = '16px';

  container.appendChild(saveBtn);

  // Ruangan mesej status.
  const notice = document.createElement('p');
  notice.style.fontSize = '13px';
  notice.style.color = '#64748b';
  notice.setAttribute('role', 'status');
  container.appendChild(notice);

  // Elakkan klik berulang semasa menyimpan.
  let isSaving = false;

  saveBtn.addEventListener('click', function() {
    if (isSaving) return;

    const payload = {
      complaintId: item.id,
      status: status.value,
      assignee: assignee.value.trim(),
      note: note.value.trim(),
      targetDate: targetDate.value
    };

    // Semak input sebelum menghantar.
    if (payload.assignee.length < 3 ||
        payload.assignee.length > 150) {
      notice.textContent =
        'Sila isi pihak bertanggungjawab (3-150 aksara).';
      notice.style.color = '#b91c1c';
      assignee.focus();
      return;
    }

    if (payload.note.length < 10 ||
        payload.note.length > 2000) {
      notice.textContent =
        'Catatan tindakan mesti 10-2000 aksara.';
      notice.style.color = '#b91c1c';
      note.focus();
      return;
    }

    if (!confirm(
      'Simpan tindakan untuk aduan ' +
      item.id + '?'
    )) {
      return;
    }

    isSaving = true;
    saveBtn.disabled = true;
    button.disabled = true;

    saveBtn.textContent = 'Menyimpan...';
    notice.textContent = 'Sedang menyimpan tindakan.';
    notice.style.color = '#64748b';

    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || result.success !== true) {
          notice.textContent =
            'Respons tidak dapat disahkan. ' +
            'Semak Google Sheets sebelum cuba lagi.';
          notice.style.color = '#b91c1c';
          saveBtn.textContent = 'Semak Rekod';
          return;
        }

        notice.textContent =
          'Tindakan berjaya disimpan!';
        notice.style.color = '#15803d';

        saveBtn.textContent = 'Berjaya Disimpan';

        // Dapatkan status terkini daripada Sheets.
        loadComplaints();
      })
      .withFailureHandler(function(error) {
        notice.textContent =
          'Status simpanan belum dapat disahkan. ' +
          'Semak tab TINDAKAN dan ADUAN sebelum ' +
          'mencuba semula. ' +
          (error.message || '');

        notice.style.color = '#b91c1c';
        saveBtn.textContent = 'Semak Rekod';

        // Kekalkan butang tidak aktif
        // untuk elakkan rekod berganda.
        console.error(error);
      })
      .saveAdminAction(payload);
  });


  card.appendChild(container);
  button.textContent = 'Tutup Borang Tindakan';
}

function prepareMonthlyReport() {
  const month =

    );

  }


try {
  const report = buildMonthlyReportData(month, year);

/**
 * Fasa 5.0D-B: Sediakan data laporan bulanan.
 * Membaca allComplaints sahaja.
 * Tiada perubahan pada Google Sheets.
 */
function buildMonthlyReportData(month, year) {
  const activeStatuses = [
    'BAHARU',
    'DALAM_SEMAKAN',
    'DALAM_TINDAKAN'
  ];

  const validStatuses = activeStatuses.concat([
    'SELESAI',
    'DITOLAK'
  ]);

  const selectedPeriod = Number(year) * 100 +
    Number(month);

  if (
    !/^(0[1-9]|1[0-2])$/.test(String(month)) ||
    !/^\d{4}$/.test(String(year))
  ) {
    throw new Error('Bulan atau tahun laporan tidak sah.');
  }

  const monthly = [];
  const previousPending = [];
  const issues = [];

  allComplaints.forEach(function(item) {
    const id = String(item.id || '').trim();
    const dateText = String(item.date || '');

    const match = dateText.match(
      /^(\d{2})\/(\d{2})\/(\d{4})(?:\s|$)/
    );

    if (!match) {
      issues.push(id + ': format tarikh tidak sah');
      return;
    }

    const day = Number(match[1]);
    const mm = Number(match[2]);
    const yyyy = Number(match[3]);

    const utc = Date.UTC(yyyy, mm - 1, day);
    const check = new Date(utc);

    if (
      check.getUTCFullYear() !== yyyy ||
      check.getUTCMonth() !== mm - 1 ||
      check.getUTCDate() !== day
    ) {
      issues.push(id + ': tarikh tidak sah');
      return;
    }

// Fasa 5.0D: Semak tarikh aduan masa depan.
const malaysiaParts = new Intl.DateTimeFormat('en-GB', {
  timeZone: 'Asia/Kuala_Lumpur',
  year: 'numeric',
  month: '2-digit',
  day: '2-digit'
}).formatToParts(new Date());

const malaysiaDate = {};

malaysiaParts.forEach(function(part) {
  if (part.type !== 'literal') {
    malaysiaDate[part.type] = part.value;
  }
});

const todayUTC = Date.UTC(
  Number(malaysiaDate.year),
  Number(malaysiaDate.month) - 1,
  Number(malaysiaDate.day)
);


if (
  !malaysiaDate.year ||
  !malaysiaDate.month ||
  !malaysiaDate.day ||
  !Number.isFinite(todayUTC)
) {

  issues.push(id + ': gagal mengesahkan tarikh semasa');
  return;
}

if (utc > todayUTC) {
  issues.push(id + ': tarikh aduan berada pada masa depan');
  return;
}

    const status = String(item.status || '');

    if (!validStatuses.includes(status)) {
      issues.push(id + ': status tidak dikenali');
      return;
    }

    const itemPeriod = yyyy * 100 + mm;

    if (itemPeriod === selectedPeriod) {
      monthly.push(item);
    } else if (
      itemPeriod < selectedPeriod &&
      activeStatuses.includes(status)
    ) {
      previousPending.push(item);
    }
  });

  if (issues.length) {
    throw new Error(
      'Terdapat rekod yang perlu disemak: ' +
      issues.join('; ')
    );
  }

  const counts = {
    total: monthly.length,
    selesai: monthly.filter(function(item) {
      return item.status === 'SELESAI';
    }).length,
    belumSelesai: monthly.filter(function(item) {
      return activeStatuses.includes(item.status);
    }).length,
    ditolak: monthly.filter(function(item) {
      return item.status === 'DITOLAK';
    }).length,
    tertunggakLama: previousPending.length
  };

  return {
    month: month,
    year: year,
    generatedAt: new Date().toISOString(),
    counts: counts,
    monthly: monthly,
    previousPending: previousPending
  };
}
